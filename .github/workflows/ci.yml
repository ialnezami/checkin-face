name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      
      - name: Install dependencies (Backend)
        run: |
          cd backend
          npm ci
      
      - name: Install dependencies (Frontend)
        run: |
          cd frontend
          npm ci
      
      - name: Lint Backend
        run: |
          cd backend
          npm run lint || true
      
      - name: Lint Frontend
        run: |
          cd frontend
          npm run lint || true
      
      - name: Type Check Backend
        run: |
          cd backend
          npm run build || true
      
      - name: Type Check Frontend
        run: |
          cd frontend
          npm run type-check || true

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: checkin_db_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: |
          cd backend
          npm ci
      
      - name: Run tests
        run: |
          cd backend
          npm test || echo "Tests not implemented yet"
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: checkin_db_test
          DB_USER: postgres
          DB_PASSWORD: postgres

